name: Verify release artifacts
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download published Windows and Linux builds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release download "$RELEASE_TAG" --dir artifacts
      - name: Verify checksums and both platforms
        run: |
          cd artifacts
          test "$(find . -name '*windows-x64.zip' | wc -l)" -eq 1
          test "$(find . -name '*linux-x86_64.AppImage' | wc -l)" -eq 1
          sha256sum -c ./*.sha256
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          with zipfile.ZipFile(next(Path('.').glob('*windows-x64.zip'))) as z:
              names = z.namelist()
              receipt = json.loads(z.read(next(n for n in names if n.endswith('AOT_CACHE_AUDIT.json'))))
              assert receipt['published_pairs'] > 0
          PY
